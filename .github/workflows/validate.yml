name: Validate public package
on:
  push:
    branches: [main]
  pull_request:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-02
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-02
        with:
          python-version: '3.11'
      - name: Validate catalogs, links, examples and public manifest
        run: python scripts/validate_repository.py
      - name: Test offline HTML auditor
        run: python -m unittest discover -s skills/seo-geo/scripts -p 'test_*.py'
      - name: Test local agent inspector
        run: python -m unittest discover -s tools/observer -p 'test_*.py'
      - name: Test repository checks
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Inspect shipped configuration
        run: python tools/observer/observe.py
      - name: Audit synthetic capture
        run: python skills/seo-geo/scripts/audit_snapshot.py --input skills/seo-geo/assets/snapshot.example.json
